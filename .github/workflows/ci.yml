name: build-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-and-import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile all Python sources
        run: python -m py_compile $(find src -name '*.py')
      - name: Import check (no side effects at import time)
        run: |
          python -c "
          import ast, pathlib
          for p in pathlib.Path('src').rglob('*.py'):
              ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
          print('OK: all src/*.py parse as valid Python')
          "

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the code-agent image
        run: docker build -t llmhib-code-agent:ci .
